kind = "web"
previewPath = "/"
title = "Student Career Development & Placement System"
version = "1.0.0"
id = "artifacts/placement-system"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20641

[services.development]
run = "pnpm --filter @workspace/placement-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/placement-system", "run", "build" ]
serve = "static"
publicDir = "artifacts/placement-system/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20641"
BASE_PATH = "/"
